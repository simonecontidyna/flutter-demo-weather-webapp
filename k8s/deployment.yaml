apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-dashboard
  namespace: weather-dashboard
  labels:
    app.kubernetes.io/name: weather-dashboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-dashboard
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: weather-dashboard
          # Replace with your registry/image:tag
          image: weather-dashboard:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: false
      restartPolicy: Always
