###############################################
# Weather Dashboard - Kubernetes Deployment
# Usage: kubectl apply -f k8s/deploy.yaml
###############################################
---
apiVersion: v1
kind: Namespace
metadata:
  name: weather-dashboard
  labels:
    app.kubernetes.io/name: weather-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-dashboard
  namespace: weather-dashboard
  labels:
    app.kubernetes.io/name: weather-dashboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-dashboard
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: weather-dashboard
          image: simoneconti/weather-dashboard:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: weather-dashboard
  namespace: weather-dashboard
  labels:
    app.kubernetes.io/name: weather-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: weather-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-dashboard
  namespace: weather-dashboard
  labels:
    app.kubernetes.io/name: weather-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-ingress-class: nginx
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: weatherdemo.simoneconti.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-dashboard
                port:
                  name: http
  tls:
    - hosts:
        - weatherdemo.simoneconti.com
      secretName: weather-dashboard-tls
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: weather-dashboard
  namespace: weather-dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weather-dashboard
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
